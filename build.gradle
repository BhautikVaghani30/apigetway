plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.core.township'
version = '0.0.1-SNAPSHOT'
description = 'town-api-getway'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = 'https://repo.spring.io/snapshot' }
    // Required for Spring Cloud Snapshots/Milestones if applicable
    maven { url = 'https://repo.spring.io/milestone' }
}

ext {
    // Spring Cloud version compatible with Boot 3.x
    set('springCloudVersion', "2024.0.0")
    set('springBootAdminVersion', "3.0.0-M5")
}

dependencies {

    // 1. The Core Reactive Gateway Dependency
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'

    // 2. Resilience4j for Reactive Circuit Breaking (Highly recommended)
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'

    // 3. Actuator for health checks and route monitoring
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 4. Validation for incoming request bodies
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 5. JWT Library for Token Validation
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'com.core.township:common:1.1.4'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
