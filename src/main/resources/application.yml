server:
  port: 8080 # The port the Gateway runs on

spring:
  application:
    name: town-api-gateway

  cloud:
    gateway:
      # CORS Configuration (Crucial for frontend access)
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*" # Change this to your frontend URL in production
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
            allowedHeaders: "*"

      routes:
        # 1. PUBLIC Route (Login, Register) - NO AUTH FILTER
        # Matches: Only Login and Signup
        - id: orch-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/login, /api/v1/auth/signup
          filters:
            - AddResponseHeader=X-Via-Gateway, Town-Api-Gateway

        # 2. User Service - SECURED
        # Matches: /api/v1/user/**
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/user/**
          filters:
            - Authentication # Applies the AuthenticationFilter class

        # 3. Society Service - SECURED
        # Matches: /api/v1/societies/**
        - id: society-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/societies/**
          filters:
            - Authentication
